plugins {
    id 'java'
    id 'application'
    id 'org.graalvm.buildtools.native' version '0.10.1'
}

group 'me.mprieto'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

ext {
    versions = [
            antlr4    : '4.11.1',
            commonsCli: '1.4',
            lombok    : '1.18.30',
            jackson   : '2.14.1',
            conductor : '3.21.19',
            junit     : '5.8.1',
            graalvmSdk: '23.1.2'
    ]
}

dependencies {
    //TODO logging dependencies + configuration
    //FIXME we only need the antrl4-runtime but while developing the BatonTestRig class is very useful.
    implementation "org.antlr:antlr4:${versions.antlr4}"
    implementation "commons-cli:commons-cli:${versions.commonsCli}"
    compileOnly "org.projectlombok:lombok:${versions.lombok}"
    annotationProcessor "org.projectlombok:lombok:${versions.lombok}"
    implementation "com.fasterxml.jackson.core:jackson-databind:${versions.jackson}"
    implementation "com.fasterxml.jackson.core:jackson-core:${versions.jackson}"
    implementation "org.conductoross:conductor-common:${versions.conductor}"
    compileOnly "org.graalvm.sdk:graal-sdk:${versions.graalvmSdk}"

    testCompileOnly "org.projectlombok:lombok:${versions.lombok}"
    testAnnotationProcessor "org.projectlombok:lombok:${versions.lombok}"
    testImplementation "org.junit.jupiter:junit-jupiter-api:${versions.junit}"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${versions.junit}"
}

sourceSets {
    main {
        java {
            srcDir 'src/main/java'
            srcDir 'src/main/gen'
        }
    }
}

test {
    useJUnitPlatform()
}

application {
    mainClass = 'me.mprieto.baton.Main'
}

run {
    args = ['-f', 'samples/baton/sample0.baton']
}

// Regular JAR task for fat JAR
tasks.register('fatJar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveBaseName = 'baton'

    manifest {
        attributes 'Main-Class': 'me.mprieto.baton.Main'
    }

    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    with jar
}

// Standard JAR without dependencies (for native-image)
jar {
    archiveBaseName = 'baton-classes-only'
    manifest {
        attributes 'Main-Class': 'me.mprieto.baton.Main'
    }
}

graalvmNative {
    toolchainDetection = false

    binaries {
        main {
            mainClass = 'me.mprieto.baton.Main'
            imageName = 'baton'
            buildArgs.add('--no-fallback')
            buildArgs.add('-H:+ReportExceptionStackTraces')
        }
    }

    agent {
        defaultMode = "standard"
        builtinCallerFilter = true
        builtinHeuristicFilter = true
        enableExperimentalPredefinedClasses = false
        enableExperimentalUnsafeAllocationTracing = false
        trackReflectionMetadata = true

        modes {
            standard {}
        }

        metadataCopy {
            inputTaskNames.add("run")
            outputDirectories.add("src/main/resources/META-INF/native-image")
            mergeWithExisting = true
        }
    }
}
